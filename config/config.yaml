embed_model: "models/embedders/Qwen3-Embedding-4B-Q5_K_M.gguf"
embedding_model_context_window: 4096

top_k: 10
num_candidates: 50
ensemble_method: "rrf"
ranker_weights: {"faiss":0.7,"bm25":0,"index_keywords":0,"kg_node":0.1,"section_tree":0.1,"section_summary":0.1}
kg_graph_dir: "data/knowledge_graph/runs"
rrf_k: 60
max_gen_tokens: 400
chunk_mode: "recursive_sections"
gen_model: "models/generators/qwen2.5-3b-instruct-q8_0.gguf"
chunk_size_in_chars: 2000
chunk_overlap: 300
use_hyde: false
hyde_max_tokens: 300
use_indexed_chunks: false
rerank_mode: "cross_encoder"
rerank_top_k: 5
use_double_prompt: false
enable_history: true
max_history_turns: 3
enable_topic_extraction: false
semantic_cache_enabled: false
semantic_cache_bi_encoder_threshold: 0.90
semantic_cache_cross_encoder_threshold: 0.99
enable_topic_extraction: false
kg_pipeline:
  corpus_description: "Database System Concepts, 7th edition by Silberschatz et al."
  min_cooccurrence: 0
  top_n: 10
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  partial: false
  chapter: null
  exclude_chapters: []
  extractor:
    type: openrouter          # json | openrouter | keybert | slm
    extractions: ""   # [json] path to extractions JSON; null = use extractions/latest.json
    model: "qwen/qwen3-next-80b-a3b-instruct"  # [openrouter] model name
    adaptive_top_n: true                       # [openrouter] scale top_n per chunk
    keybert_model: "all-MiniLM-L6-v2"          # [keybert] sentence-transformer model
    slm_model_path: "models/qwen2.5-1.5b-instruct-q5_k_m.gguf"  # [slm] GGUF model path
    slm_threads: 8                              # [slm] CPU threads
  canonicalization:
    llm_model: "qwen/qwen3-next-80b-a3b-instruct"
    similarity_threshold: 0.78
    max_group_size: 30
    batch_size: 15
    embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  summary_tree:
    summary_model: "openai/gpt-4o-mini"
    embed_model: "sentence-transformers/all-MiniLM-L6-v2"
    chunk_window: 3
