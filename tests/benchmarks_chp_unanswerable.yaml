benchmarks:
- id: uchp_sirchesi_2028_outcomes
  question: What are the specific quantitative health outcomes, such as HIV transmission
    rates, of the SiRCHESI project for the year 2028?
  expected_answer: The textbook cannot answer this question. It describes the SiRCHESI
    project's participatory framework and its success in reducing HIV transmission among
    high-risk groups in Cambodia up to its publication date, but provides no longitudinal
    data for years following the book's current timeline. 2028 is beyond the source
    material.
  keywords:
  - SiRCHESI
  - HIV transmission
  - Cambodia
  - quantitative outcomes
  - 2028
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires future longitudinal data (2028) beyond the textbook's
    publication timeline.

- id: uchp_samoan_healing_protocols
  question: How do the specific traditional healing protocols and herbal recipes in
    the Samoan islands of Upolu and Savai'i differ from one another?
  expected_answer: The textbook cannot answer this question. It discusses Samoan community
    leaders' beliefs regarding pain and illness within the context of Aotearoa New Zealand,
    but does not provide a detailed comparison of regional traditional healing practices
    or herbal recipes between Upolu and Savai'i specifically.
  keywords:
  - Samoan healing
  - traditional protocols
  - herbal recipes
  - Upolu
  - Savai'i
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires intra-Samoa regional clinical detail not present in
    the textbook.

