- id: uchp_treaty_principles_bill_2025
  question: How did the termination of the Treaty Principles Bill in 2025 specifically
    impact the recruitment and retention rates of Māori clinical psychologists in
    the five years following its removal?
  expected_answer: The textbook cannot answer this question. It records that the Treaty
    Principles Bill was terminated in April 2025 and discusses the ongoing underrepresentation
    of Māori in the psychology workforce, but cannot provide retrospective longitudinal
    workforce data for the years after 2025.
  keywords:
  - Treaty Principles Bill
  - 2025
  - Māori clinical psychologists
  - recruitment
  - retention
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires post-publication longitudinal workforce data (2026–2030)
    not yet in existence at the time of writing.

- id: uchp_moumoukai_nitrates
