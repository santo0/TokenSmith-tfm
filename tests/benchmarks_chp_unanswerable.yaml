- id: uchp_flibanserin_dosage
  question: What is the precise clinical dosage of Flibanserin ("Pink Viagra") recommended
    by the manufacturer for a 45-year-old woman with no underlying comorbidities?
  expected_answer: The textbook cannot answer this question. It critically analyses
    the medicalisation of female desire and the controversy surrounding Flibanserin's
    efficacy, but as a critical textbook rather than a clinical manual it does not
    provide pharmacological prescribing information or manufacturer dosage guidelines.
  keywords:
  - Flibanserin
  - Pink Viagra
  - clinical dosage
  - prescribing information
  - female sexual dysfunction
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires manufacturer prescribing information not present in
    a critical health psychology textbook.

