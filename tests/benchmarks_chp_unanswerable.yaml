- id: uchp_biographical_flow_parkinsons_japan
  question: How do critical health psychologists in Japan specifically adapt the concept
    of "biographical flow" when working with patients diagnosed with early-onset Parkinson's
    disease?
  expected_answer: The textbook cannot answer this question. It defines "biographical
    flow" as an alternative to "biographical disruption" and examines Japanese cultural
    views on menopause, but does not combine these specific concepts in a clinical
    application for Parkinson's disease in Japan.
  keywords:
  - biographical flow
  - Japan
  - Parkinson's disease
  - early-onset
  - clinical application
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires a combination of concepts (biographical flow + Japan
    + Parkinson's) not synthesised anywhere in the textbook.

