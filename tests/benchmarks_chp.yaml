- id: pl_chp_practices_vs_behaviour
  question: Why do critical health psychologists prefer the term "practices" over
    "behaviour" when describing what people do?
  expected_answer: 'Critical health psychologists tend to use "practices" rather than
    "behaviour" because the latter locates action as an outcome of individual decisions,
    implying a rational autonomous self. The word "practices" recognises that what
    people do is shaped by a range of social and relational elements — social norms,
    expectations, power relations, and the contexts in which people live and interact.
    This terminological choice reflects the broader critical concern with moving beyond
    individualism and attending to the social structures and discursive contexts that
    shape human activity. Using "practices" thus shifts analytic focus from individual
    cognition and decision-making to the socially embedded, relational, and contextual
    production of action.

    '
