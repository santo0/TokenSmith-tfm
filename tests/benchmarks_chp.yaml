- id: chp_cultural_safety
  question: What is cultural safety in health psychology practice and how does it
    differ from cultural competence?
  expected_answer: 'Cultural safety, developed in Aotearoa New Zealand by Irihapeti
    Ramsden, focuses on producing a workforce of self-aware practitioners who are
    culturally safe to practice as defined by the people they serve. It requires critical
    reflection on one''s own positionality and how it shapes engagement with and interpretation
    of the world. Cultural safety goes beyond cultural competence, which can reduce
    culture to a checklist of learned facts, by emphasising reflexivity, power-awareness,
    and accountability to those receiving care. In Aotearoa New Zealand, cultural
    safety is inseparable from Te Tiriti o Waitangi and recognition of Māori rangatiratanga.
    Cultural humility — openness, self-awareness, and a willingness to learn from
    cultures different from one''s own — is described as an essential ingredient.

    '
