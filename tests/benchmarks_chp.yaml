- id: chp_te_whare_tapa_wha
  question: What are the four domains of Te Whare Tapa Whā and what does the model
    represent?
  expected_answer: 'Te Whare Tapa Whā is a seminal Māori health model developed by
    Sir Mason Durie that frames wellbeing as achieved through balance across four
    domains: te taha tinana (physical wellbeing), te taha hinengaro (mental and emotional
    wellbeing), te taha whānau (family and social wellbeing), and te taha wairua (spiritual
    wellbeing). The whare also sits on whenua, representing the importance of Māori
    connection to ancestral lands and the natural environment. Wellbeing flourishes
    when all four domains are cared for and in balance; illness or dysfunction develops
    when one or more domains are compromised.

    '
