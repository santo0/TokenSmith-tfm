- id: chp_hauora_definition
  question: What is hauora and how is it conceptualised in Māori culture?
  expected_answer: 'Hauora describes the breath of life and spirit; it refers to a
    physical sense of wellbeing for an individual that is interdependent with collective
    qualities such as whanaungatanga. Māori notions of health and wellbeing are holistic,
    relational, and grounded in Māori cultural worldviews. Related terms include mauri
    ora (life-giving essence), waiora (total wellbeing and strength of spirit), and
    whānau ora (family and collective wellbeing). The chapter is named Hauora to reflect
    the connection between physical, psychological, relational, and spiritual dimensions
    of health.

    '
