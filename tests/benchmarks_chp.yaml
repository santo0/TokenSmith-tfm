- id: chp_frank_narratives
  question: What are Arthur Frank's three types of illness narratives and what does
    each involve?
  expected_answer: 'Arthur Frank identified three narrative templates people use in
    response to illness. Restitution narratives construct illness as a temporary issue
    focused on restoring the person to their original life before illness; illness
    is a temporary problem that does not substantially change the sense of self. Quest
    narratives construct illness as a loss but also as conferring some benefit — an
    insight or new ways of thinking — involving a heroic arc of call, descent, suffering,
    return, and reward for suffering. Chaos narratives are anti-narratives where events
    do not flow from one to another with resolution; chaos reigns, the future is unpredictable,
    and there is no happy ending. Frank also described five dramas played out in illness
    narratives — genesis, emotions, faith and desire, fear and loss, and the self.

    '
