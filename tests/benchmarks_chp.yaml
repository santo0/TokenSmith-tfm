- id: chp_symptom_interpretation_social
  question: Why do critical health psychologists prefer the concept of symptom interpretation
    over symptom perception?
  expected_answer: 'Critical health psychologists argue that making sense of bodily
    changes is more complex than simply perceiving them. Symptom perception, dominant
    in mainstream psychology, focuses on solitary thought processes and individual
    cognitive appraisal of bodily signs. Symptom interpretation, by contrast, recognises
    that people assign meaning to bodily sensations within their specific cultural
    and social contexts, shaped by intersecting social identities (race, gender, class),
    cultural norms about which bodily disturbances warrant attention, and social negotiation
    with others. Pain provides a key example — its interpretation varies dramatically
    across cultures and genders, as shown by studies of Somali-Canadian women and
    cross-cultural menopause research. Symptom interpretation is thus both embodied
    and socially embedded.

    '
