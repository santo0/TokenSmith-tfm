- id: ec_chp_restitution_quest_chaos
  question: How do restitution, quest, and chaos illness narratives differ, and what
    happens when someone cannot tell a restitution or quest narrative?
  expected_answer: 'In restitution narratives, illness is temporary and the person
    is restored to their original life; the sense of self is not substantially changed.
    In quest narratives, illness involves loss but also some benefit — an insight
    or new way of being; there is a heroic arc culminating in a reward. Chaos narratives
    are anti-narratives with no resolution, no purposeful suffering, and an unpredictable
    future. Quest and restitution narratives are culturally valued, while chaos stories
    are often resisted as too transgressive and frightening for listeners to hear.
    When people cannot tell a restitution or quest story, they may be silenced by
    others who enforce positive feeling rules, preventing chaos narratives from being
    heard and causing additional distress and social isolation.

    '
