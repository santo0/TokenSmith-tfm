- id: chp_five_knowledge_approaches
  question: What are the five approaches to knowledge in health psychology and how
    do they differ?
  expected_answer: 'The five approaches are: (1) Objectivist science of mainstream
    psychology — understands psychological factors as located in the individual, discoverable
    through systematic observation producing objective, generalisable knowledge. (2)
    Phenomenological psychology — foregrounds the subjective, contextualised interpretation
    of health experience by the individual. (3) Social constructionism and poststructuralism
    — conceptualise health as constructed through discourse and study multiple discourses
    and their implications for subjectivity. (4) More-than-human theory — further
    decentres the subject, conceptualising health as produced through entangled human
    and non-human elements in an unfolding discursive and material assemblage. (5)
    Kaupapa Māori research — understands knowledge as holistic, relational, and produced
    through connections across the spiritual, physical, psychological, social, and
    land, enacted in the service of Māori wellbeing.

    '
