- id: chp_biographical_disruption
  question: What is biographical disruption and what aspects of a person's life does
    illness disrupt?
  expected_answer: 'Biographical disruption, coined by Bury (1982) in a study of people
    diagnosed with rheumatoid arthritis, describes how illness disrupts the expected
    life story of a person. It recognises that multiple elements of self-experience
    are disrupted simultaneously. The body is disrupted as illness forces it into
    unwanted awareness ("presence-absence" becomes intrusive presence). Life trajectory
    is disrupted as illness reduces the ability to live in previously valued ways
    and creates an uncertain future. Relations with others are disrupted through increased
    dependency, reduced social interaction, and new relationships with medical staff.
    Biographical disruption often forces fundamental re-evaluation of identity, requiring
    people to craft new narratives about who they are.

    '
