- id: pl_chp_discourse
  question: What does "discourse" mean in critical health psychology and how does
    it shape health?
  expected_answer: 'In critical health psychology, discourse refers to relatively
    coherent ways of making sense of an issue — language and practices that produce
    understandings, norms, expectations, and subject positions. Drawing on Foucault,
    discourse is not merely descriptive; it actively constructs what is possible to
    say, think, feel, or do. Healthism is an example of a dominant health discourse
    that constructs health as an individual moral responsibility, producing shame
    around illness. Discourses are not simply ideas but are embedded in practices
    and institutions, and they shape material outcomes such as healthcare access and
    funding. Multiple, potentially contradictory discourses circulate simultaneously,
    giving people different subject positions from which to make sense of their health.

    '
