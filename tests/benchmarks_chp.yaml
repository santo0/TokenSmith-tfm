- id: ec_chp_ontology_epistemology
  question: What is the difference between ontology and epistemology, and how are
    they understood in Māori frameworks?
  expected_answer: 'Ontology refers to understandings about the nature of reality
    and human nature. Epistemology refers to understandings about the nature of knowledge
    — what we can know and how we can know it. From a Māori perspective, ontologies
    emphasise connectedness, relationships, and a spiritual element, underpinned by
    whakapapa and whanaungatanga. Māori epistemologies recognise whakapapa as a means
    by which Māori record, remember, and impart knowledges about the world, alongside
    pūrākau (narratives and metaphor). Cosmologies refer to beliefs about the nature
    of the universe and cosmogonies to its origins, described in Māori traditions
    through te kore, te pō, and te ao mārama.

    '
