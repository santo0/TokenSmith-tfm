- id: chp_social_constructionism
  question: What is the social constructionist model of the person and how does it
    differ from individualist psychology?
  expected_answer: 'Social constructionism shifts analytic focus away from the individual
    and onto the shared social constructs that circulate between people. It holds
    that what we consider facts about the world are culturally shared agreements about
    reality. In this model the person is constituted through language, since language
    provides the building blocks for thought and thus shapes what people can say,
    think, feel, or do. People are therefore multiple, contradictory, fluid, and partial
    rather than unified, coherent, and bounded as individualist psychology assumes.
    This de-centres the subject and moves psychology''s focus from the individual
    to the socio-historic context in which meaning is produced.

    '
