- id: chp_assemblage_treatment
  question: What is the assemblage framework and how is it applied to understanding
    treatment experiences?
  expected_answer: 'The assemblage concept, drawn from more-than-human theory and
    associated with Deleuze and Guattari, conceptualises treatment experiences as
    produced through an open system of multiple intersecting discursive and material
    elements — human and non-human — that momentarily actualise. Rather than focusing
    on individual patients or specific technologies in isolation, an assemblage framework
    examines the flows between elements in the system, such as disease, device, patient,
    cardiologist, and cultural norms simultaneously shaping a treatment experience.
    Applied to health, this draws attention to the co-constitutive and dynamic nature
    of treatment, including how technologies, spaces, bodies, knowledge, and power
    relations interact in an unfolding process.

    '
