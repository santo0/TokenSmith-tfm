- id: chp_healthism
  question: What is healthism and how does it shape people's experiences of health?
  expected_answer: 'Healthism is a discourse that constructs health as a measure of
    a person''s value, morality, and citizenship. It produces individualistic orientations
    to health in which people are held personally responsible for their health outcomes,
    and illness is framed as a kind of individual failure that may elicit shame. Healthism
    aligns with neoliberal ideologies that shift responsibility for health onto individuals
    while downplaying state responsibilities for creating conditions that make good
    health more likely. It shapes people''s sense of self, limiting possibilities
    for equitable health care, and can be challenged or destabilised through critical
    reflection and collective approaches.

    '
