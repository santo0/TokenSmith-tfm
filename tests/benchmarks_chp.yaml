- id: pl_chp_whakapapa
  question: What does "whakapapa" mean and how is it applied across Māori ontology,
    epistemology, and health?
  expected_answer: 'Whakapapa means genealogy; more specifically it refers to layers
    of genealogy. In Māori ontology, whakapapa describes how human life descends from
    atua, and is thus related to the natural environment — it is the structure by
    which all things are connected. In Māori epistemology, whakapapa is the means
    by which Māori record, remember, and impart knowledges about the world, reinforcing
    connectedness across time and space. In health contexts, whakapapa shapes cultural
    identity, grounds people in their tūrangawaewae (standing place and belonging),
    and is central to Māori models of health such as the Meihana Model. Cultural access
    to whakapapa and ancestral connections is understood as foundational to hauora.

    '
