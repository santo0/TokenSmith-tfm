- id: chp_maori_creation_phases
  question: What are the three phases of Māori creation narratives and what does each
    represent?
  expected_answer: 'Māori cosmogonies commonly describe the creation of the universe
    in three phases. Te kore is the most distant phase — the source of all life meaning
    "the void" or "nothing", yet understood as energetic and the space of infinite
    potential. Te pō means "darkness" and refers to periods of perceptual and mental
    darkness; it is the realm of becoming where earth and life develop, and where
    the primordial atua Papatūānuku and Ranginui come into existence. Te ao mārama
    is the third phase — the world of light where human life develops after Tāne separates
    Ranginui and Papatūānuku; it is the realm in which growth and enlightenment are
    possible.

    '
