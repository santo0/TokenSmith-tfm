- id: ec_chp_illness_disease_disability
  question: How do illness, disease, and disability differ from one another?
  expected_answer: 'Illness refers to the subjective experience of feeling unwell
    — the lived experience of a condition, encompassing personal and social aspects
    of feeling ill and typically involving reduced functionality. Disease is a pathological
    condition characterised by symptomatology and diagnosed by medical experts; it
    is the medical diagnosis of an illness. Disability refers to a physical or mental
    condition that significantly limits movements, senses, or activities; the social
    model of disability emphasises that societal barriers (such as buildings accessible
    only by stairs) create disability rather than the individual condition itself.
    These distinctions are useful but overlapping — for instance Long COVID is a chronic
    condition resulting from a communicable virus, and improving medical treatments
    can shift conditions between acute and chronic categories.

    '
