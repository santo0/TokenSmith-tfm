- id: chp_foucault_power
  question: How does Foucault conceptualise power and how does this relate to health?
  expected_answer: 'Foucault describes power as productive, diffuse, and embedded
    in everyday practices and discourses rather than being simply repressive or held
    by one group over another. Power operates through discourses — relatively coherent
    ways of making sense of an issue — which produce understandings, norms, expectations,
    and subject positions. Disciplinary power operates through surveillance and the
    internalisation of norms (illustrated by Bentham''s panopticon). Governmentality
    describes how modern states govern citizens through self-regulation. In health
    contexts, power shapes which bodies, behaviours, and knowledge claims are valued,
    producing healthism, epistemic injustice, and health inequities.

    '
