- id: pl_chp_liminality
  question: What is liminality and how is it applied to the experience of becoming
    a critical health psychology practitioner?
  expected_answer: 'Liminality refers to an in-between state where someone is transitioning
    from one way of being into another. Greco and Stenner describe liminal occasions
    as important moments in time and space where potentially valuable transformation
    occurs, contrasted with liminal hotspots where a person risks getting stuck between
    two mutually exclusive alternatives. In chapter 3.2, liminality is applied to
    the experience of students moving from theory to practice in a practicum — simultaneously
    students and emerging practitioners. This liminal space is characterised by vulnerability,
    anxiety, and a lack of confidence. Rather than treating liminality as a problem
    to be managed through narrow skill acquisition, the chapter argues that reflexively
    engaging with discomfort and uncertainty fosters deeper growth as a critical health
    psychology practitioner.

    '
