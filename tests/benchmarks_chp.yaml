- id: ec_chp_sign_symptom_credibility
  question: What is the difference between a bodily sign and a symptom, and what is
    credibility work?
  expected_answer: 'A sign is a change in the body that can be seen or measured —
    such as a rise in temperature or the appearance of aberrant growths — and is considered
    objective evidence of disease. A symptom is the subjective experience of something
    out of the ordinary that an individual needs to make sense of. Symptoms are not
    simply perceptions but interpretations embedded in social and cultural contexts.
    Credibility work describes the efforts people make to convince others that their
    symptoms are legitimate and warrant medical attention; this includes what they
    say, do, and even their appearance. Without successful credibility work, people
    may fail to gain social sanctioning for their illness and be denied the sick role,
    as commonly experienced by people with contested illnesses such as fibromyalgia.

    '
