- id: chp_phenomenological_psychology
  question: What is phenomenological psychology and how does it conceptualise the
    person?
  expected_answer: 'Phenomenological psychology is an idiographic approach that prioritises
    a deep dive into individual lived experiences as people understand and experience
    them. Drawing on philosophers such as Husserl, Heidegger, and Merleau-Ponty, it
    conceptualises the person as a situated meaning-maker whose interpretation of
    the lifeworld is shaped by embodiment, temporality, spatiality, affect, intersubjectivity,
    and personal history. Unlike mainstream psychology''s nomothetic approach, phenomenology
    collapses the subject-object distinction and rejects the idea that researchers
    can observe the world objectively from outside it. Although richly theorised,
    it remains largely individualist and offers limited tools for analysing power.

    '
