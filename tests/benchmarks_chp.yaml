- id: chp_biopsychosocial_problems
  question: What are the main problems with the biopsychosocial approach according
    to critical health psychologists?
  expected_answer: 'Critical health psychologists identify several problems with the
    biopsychosocial approach. First, poor theorising — Engel did not explain how the
    bio, psycho, and social elements causally affect each other, leaving the model
    with little explanatory power ("a slogan too vague to be of any use"). Second,
    one element getting priority — without clear theorising, one dimension dominates,
    producing "bio bio bio", "psycho psycho psycho", or partial social analyses. Third,
    an individualist approach — aligning with biomedicine through social-cognition
    models leads to reification (treating concepts as real), oversimplification, epistemic
    injustice, and under- theorising of power.

    '
  keywords:
