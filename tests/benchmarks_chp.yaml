- id: chp_five_pou
  question: What are the five pou of critical health psychology?
  expected_answer: 'The five pou (guiding principles) of critical health psychology
    are: (1) valuing theoretical and conceptual thinking; (2) challenging taken-for-granted
    understandings; (3) paying attention to issues of power and equity; (4) moving
    beyond the individualism that characterises much of Western psychology; and (5)
    considering knowledge as produced in social context. The term pou is borrowed
    from Māori culture, referring to carved poles that serve as structural supports
    for a Marae. These five pou explicitly or implicitly shape every chapter of the
    discipline.

    '
