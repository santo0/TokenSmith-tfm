- id: pl_chp_pou
  question: What is a "pou" in Māori culture and how is the term used in critical
    health psychology?
  expected_answer: 'In Māori culture, pou refers to carved wooden poles or posts that
    serve as boundary markers and support structures integral to the building of marae
    — a traditional house and centre for Māori activities. The poles support the marae,
    and the term is sometimes adopted by institutions to refer to the central values
    supporting their work. In critical health psychology, the term is borrowed to
    describe the five guiding principles (valuing theory, challenging taken-for-granted
    knowledge, paying attention to power and equity, moving beyond individualism,
    and considering knowledge in context) that underpin the discipline. These pou
    explicitly or implicitly shape every chapter of the textbook.

    '
