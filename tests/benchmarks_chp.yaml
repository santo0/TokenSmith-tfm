- id: ec_chp_equity_equality
  question: What is the difference between equity and equality in health, and why
    does the distinction matter?
  expected_answer: 'Equality means giving everyone the same thing — the same resources,
    the same treatment, the same opportunity. Equity means giving people what they
    need to reach the same outcome, recognising that people start from different positions
    due to structural and historical disadvantage. In health contexts, providing equal
    healthcare can reproduce inequities when some groups face greater barriers. Equity
    requires addressing social determinants of health and structural factors — such
    as racism, poverty, and colonisation — that produce differential health outcomes.
    Critical health psychology aligns with equity as a social justice orientation
    that acknowledges systemic and historical contexts.

    '
