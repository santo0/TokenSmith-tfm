    histories, spirituality, temporality, place, technologies, and social support
    all shape how illness is experienced — described in chapter 1.5. Wider discursive
    contexts (healthism, positivity imperatives) produce shame and social silencing.
    Chapter 1.6 shows how treatment experience is shaped by intersecting material,
    technological, and social elements conceptualised as an assemblage. Chapter 2.2
    demonstrates how symptom interpretation is socially negotiated — people must perform
    credibility work to gain social sanctioning for their illness. Chapter 2.3 discusses
    how diagnosis is embedded in social and political practices that can produce epistemic
    injustice. Chapter 3.3 describes how defining health problems is itself a political
    act, shaping what interventions are considered possible and desirable.

