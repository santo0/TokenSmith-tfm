- id: ec_am_003
  mode: entity_confusability
  question: What is the difference between process monitoring and process control
    in AM?
  expected_answer: Process monitoring records and tracks the inputs and responses
    of an AM process (e.g., laser power, melt-pool size, bed temperature) while it
    is running to verify it stays within acceptable limits, but it does not intervene.
    Process control goes further by using the data from monitoring to actively adjust
    input parameters in a closed loop, keeping the process within desired limits in
    real time. In-situ NDT uses the same sensors and analysis but yields a pass/fail
    determination about specific regions of the part being built, rather than just
    confirming process conformance.
  keywords:
  - process monitoring
  - process control
  - in-situ NDT
  similarity_threshold: 0.65
  notes: The three terms are often grouped together and their distinctions are subtle.
