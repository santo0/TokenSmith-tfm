- id: cs_am_001
  mode: cross_section_evidence
  question: How do support structures in a build plan affect post-processing cost?
  expected_answer: Support structures are defined in Step 2 (Define Build Plan) of
    the AM Design Workflow and serve to anchor overhanging features during the build.
    However, they must be removed during Step 7 (Post-processing), which adds machining
    time, material waste, and surface finishing work. The amount of support material
    is directly controlled by build orientation—keeping features above 45 degrees
    from vertical in PBF reduces the need for supports. Minimizing support material
    therefore reduces both raw material cost and post-processing labor, connecting
    build planning decisions in Step 2 directly to cost outcomes in Step 7.
  keywords:
