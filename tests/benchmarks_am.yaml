- id: pl_am_001
  mode: polysemy
  question: What does 'layer' mean in the context of additive manufacturing?
  expected_answer: In additive manufacturing, a layer is the fundamental 2D cross-
    section that a 3D printer creates at one time. The final 3D part is built as a
    stack of these discrete layers. Each layer corresponds to one slice from the build
    file and has a defined thickness determined by the process and material. For powder
    bed processes a layer is formed by spreading powder and fusing a cross-section;
    for extrusion processes a layer is a deposited bead; for vat photopolymerization
    a layer is the region of resin cured by the energy source. The layer thickness
    is a primary parameter controlling surface finish, resolution, and build time.
  keywords:
