  question: How does topology optimization differ from generative design in AM?
  expected_answer: Topology optimization is a single-solution mathematical method
    using FEA to determine the optimal material layout within a design space for given
    loads and constraints, outputting one optimized geometry. Generative design also
    performs FEA-driven optimization but uses algorithms and machine learning to automatically
    explore many permutations, generating multiple design alternatives from user-defined
    goals such as performance, material, manufacturing method, and cost. Generative
