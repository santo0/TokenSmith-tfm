- id: reasons_for_am
  question: What are the main reasons organizations choose to use additive manufacturing?
  expected_answer: Organizations use AM for several interconnected reasons tied to
    the Project Management Triple Constraint of Schedule, Scope, and Cost. Speed-related
    reasons include faster time to market and compressed development cycles. Cost
    benefits include net-shape production with reduced machining, elimination of tooling,
    and fewer assembly operations. Complexity and design benefits allow parts that
    follow load paths more closely, integrate functional features like internal cooling
    channels, and reduce part count through unitization. Durability improves by eliminating
    joints and weldments. Light weighting is possible because material is added only
    where needed. Sustainability benefits include reduced material waste and lower
    CO2 emissions.
  keywords:
  - reasons for AM
  - speed
  - cost
  - complexity
  - light weighting
  - durability
  similarity_threshold: 0.75
  ideal_retrieved_chunks: []
  broad: true
  sections:
  - Section 1.4 Reasons for Using AM
- id: powder_bed_fusion_overview
  question: How does powder bed fusion work?
  expected_answer: Powder bed fusion (PBF) is an AM process in which thermal energy
    selectively fuses regions of a powder bed. A layer is created by spreading powder
    across a build area and stepwise lowering the bed by the slice thickness. A focused
    energy beam—either a laser or an electron beam—fuses the powder particles together.
    Materials must be in powder form and can be metal, ceramic, or polymer. Metal
    systems (L-PBF) use a laser to melt metallic powder to near-full density, while
    polymer systems (SLS) typically sinter the powder below its melting point.
  keywords:
  - powder bed fusion
  - laser
  - electron beam
  - sintering
  similarity_threshold: 0.75
  ideal_retrieved_chunks: []
  broad: false
  sections:
  - Section 2.3 Powder Bed Processes
- id: directed_energy_deposition
  question: What is directed energy deposition and what materials does it use?
  expected_answer: Directed energy deposition (DED) is a family of AM processes in
    which focused energy is used to fuse materials as they are deposited. The layer
    is built by depositing beads onto a substrate (which can be an existing part),
    with new deposits building beside or on top of previous beads. Two energy modes
    are used — thermal energy melts the material in a fusion DED process akin to welding,
    while kinetic energy accelerates powder in solid-state DED processes to create
    metallurgical bonds without full melting. Materials are predominantly metallic
    and can be in powder or wire form.
  keywords:
  - directed energy deposition
  - DED
  - powder
  - wire
  - fusion
  similarity_threshold: 0.75
  ideal_retrieved_chunks: []
  broad: false
  sections:
