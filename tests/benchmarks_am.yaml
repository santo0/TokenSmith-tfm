- id: ec_am_001
  mode: entity_confusability
  question: What is the difference between binder jetting and material jetting?
  expected_answer: In binder jetting a liquid bonding agent (polymer adhesive) is
    selectively deposited through a print head to bind loose powder particles; the
    powder bed itself forms the layer and energy is applied thermally to cure the
    binder, with a sintering or infiltration step required for metals. In material
    jetting the build material itself (not just a binder) is selectively deposited
    as droplets through a print head, and the layer is built by precise X-Y deposition
    with the slice thickness defining the step. Both use print heads and both require
    post-cure thermal steps, but binder jetting binds pre-spread powder while material
    jetting deposits the actual part material directly.
  keywords:
  - binder jetting
  - material jetting
  similarity_threshold: 0.65
  notes: Both are jetting processes using print heads; dense retrieval tends to conflate
    them.
  ideal_retrieved_chunks: []
