  question: What is a build in additive manufacturing?
  expected_answer: In AM, a build refers to the complete set of parts, test coupons,
    and support structures arranged on a build platform and processed together in
    a single machine run. The build is defined by a build file (or build plan) that
    specifies part orientations, nesting layout, slice thickness, support structures,
    and toolpath. The build is treated like a released engineering document because
    orientation and nesting decisions critically affect part quality, cost, and compliance.
