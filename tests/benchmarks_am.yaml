benchmarks:
- id: am_building_blocks
  question: What are the four building blocks of additive manufacturing?
  expected_answer: The four building blocks of AM are Machines, Materials, Digital,
    and People. Machines encompasses not just 3D printers but all machinery required
    to meet part requirements. Materials covers material science, metallurgy, polymers,
    ceramics, and feedstock preparation. Digital encompasses design, simulation, sensing,
    and all data input/output. People refers to the management and organization of
    the multidisciplinary workforce needed for successful AM adoption.
  keywords:
  - building blocks
  - additive manufacturing
  - machines
  - materials
  - digital
  - people
  similarity_threshold: 0.78
  ideal_retrieved_chunks: []
  broad: false
  sections:
  - Section 1.1 The Components and Processes of Additive Manufacturing
- id: seven_am_processes
  question: What are the seven standard additive manufacturing processes?
  expected_answer: The seven standard AM processes are Binder Jetting (liquid bonding
    agent selectively deposited to join powder), Directed Energy Deposition (focused
    energy fuses material as it is deposited), Material Extrusion (material heated
    and delivered through a nozzle), Material Jetting (droplets of build material
    deposited through a print head), Powder Bed Fusion (thermal energy selectively
    fuses regions of a powder bed), Sheet Lamination (sheets of material bonded to
    form an object), and Vat Photopolymerization (liquid photopolymer in a vat selectively
    cured by light-activated polymerization).
  keywords:
  - seven AM processes
  - binder jetting
  - directed energy deposition
  - material extrusion
  - material jetting
  - powder bed fusion
  - sheet lamination
  - vat photopolymerization
  similarity_threshold: 0.8
