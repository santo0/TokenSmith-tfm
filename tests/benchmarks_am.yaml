- id: topology_optimization_vs_generative_design
  question: What is the difference between topology optimization and generative design?
  expected_answer: Topology optimization is a mathematical output from finite element
    analysis (FEA) that determines where material should be placed within a design
    space to maximize structural performance for given loads and constraints. Generative
    design also uses FEA criteria to optimize material placement but goes further
    by using algorithms and machine learning to rapidly generate and evaluate multiple
    viable design alternatives from a set of user-defined parameters (performance,
    materials, manufacturing methods, cost). While topology optimization produces
    a single optimized layout, generative design explores many permutations and can
    iterate automatically, though both may have file format and resolution challenges
    when exporting to STL.
  keywords:
  - topology optimization
  - generative design
  - FEA
  - finite element analysis
  similarity_threshold: 0.75
  ideal_retrieved_chunks: []
  broad: false
  sections:
  - Section 4.1 Design Approach
- id: ndt_methods_overview
  question: What nondestructive testing methods are used for AM parts?
  expected_answer: NDT methods for AM parts include radiographic inspection (X-rays
    or CT scanning to detect internal pores, cracks, and inclusions), ultrasonic inspection
    (sound pulses to detect volumetric discontinuities in conductive materials), eddy-current
    inspection (electromagnetic coil for surface and near- surface discontinuities
    in conductive materials), magnetic particle inspection (for ferromagnetic materials,
    detects surface and near-surface flaws), penetrant inspection (capillary action
    draws liquid penetrant into surface-open cracks), resonance inspection (treats
    the part like a tuning fork to screen for anomalies), and thermographic inspection
    (infrared imaging to detect temperature differences indicating bonding or other
    defects). AM-specific approaches also include process monitoring, process control,
    and in-situ NDT performed during the build.
  keywords:
  - nondestructive testing
  - NDT
  - radiographic
  - ultrasonic
  - penetrant
  - eddy-current
  similarity_threshold: 0.78
  ideal_retrieved_chunks: []
  broad: true
  sections:
  - Section 5.2 Nondestructive Testing (NDT)
- id: titanium_in_am
  question: Why are titanium alloys commonly used in additive manufacturing and what
    challenges arise?
  expected_answer: Titanium alloys, especially Ti-6Al-4V, are valued for their high
    strength-to-weight ratio, toughness, and corrosion resistance. AM reduces the
    buy-to-fly ratio—the amount of raw material needed versus the finished part—which
    is important because titanium is expensive to procure and machine. Challenges
    include a high propensity for distortion, residual stresses, and cracking during
    fusion AM due to the high strength-to-stiffness ratio; these are managed through
    thoughtful design, processing, and stress relief or HIP treatments. Ti-6Al-4V
    can be used in nearly every AM process because it is weldable and can absorb its
    oxide in vacuum conditions.
  keywords:
  - titanium alloys
  - Ti-6Al-4V
  - buy:fly ratio
  - residual stresses
  similarity_threshold: 0.75
  ideal_retrieved_chunks: []
  broad: false
  sections:
  - Section 3.2 Metallic Materials
- id: am_build_orientation
  question: How does build orientation affect an AM part?
  expected_answer: Build orientation in AM affects multiple aspects of the final part.
    It influences build time and material utilization (minimizing build height reduces
    cost), surface roughness including staircasing effects on angled faces, thermal
    cycling and residual stresses, microstructure and mechanical properties (AM materials
    can be anisotropic—weaker along the Z build axis), and the extent of support structures
    required and subsequent post-processing effort. Guidelines vary by process; for
    example, PBF metal parts should keep features under 45 degrees from the vertical
    to minimize supports, while holes should be oriented in the X-Y build plane.
  keywords:
  - build orientation
  - staircasing
  - residual stresses
  - support structures
  - anisotropy
  similarity_threshold: 0.73
