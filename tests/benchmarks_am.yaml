- id: ec_am_002
  mode: entity_confusability
  question: How does material extrusion differ from directed energy deposition?
  expected_answer: Material extrusion heats a polymer filament (or metal-bound filament)
    and pushes it through a nozzle to deposit beads layer by layer; energy comes from
    resistive heating of the nozzle, and metals require a subsequent sintering step.
    Directed energy deposition uses a focused beam (laser, electron beam, or arc)
    to melt the material—powder or wire—as it is simultaneously deposited onto a substrate,
    resulting in immediate fusion without a separate sintering step. DED is primarily
    used for metals and can repair or add features to existing parts; material extrusion
    handles polymers and bound-metal feedstocks and cannot directly deposit onto existing
    parts in the same repair mode.
  keywords:
  - material extrusion
  - directed energy deposition
  - DED
  - FDM
  similarity_threshold: 0.65
  notes: Both are deposition processes; naming overlap with 'extrusion' in industrial
    DED systems.
