- id: pl_am_004
  mode: polysemy
  question: What is sintering in the context of AM?
  expected_answer: In additive manufacturing, sintering is a post-build thermal process
    in which a 'green' or 'brown' part (held together by a temporary binder or loosely
    fused powder) is heated to a temperature below the melting point, causing the
    particles to bond and densify without fully melting. Sintering is required in
    binder jetting and bound-metal material extrusion to achieve the target density
    and mechanical properties. It is distinct from selective laser sintering (SLS),
    where a laser fuses polymer powder in place during the build, and from hot isostatic
    pressing (HIP), which uses pressure and heat together to close internal porosity.
  keywords:
  - sintering
  - binder jetting
  - green part
  - density
  similarity_threshold: 0.65
  notes: Sintering appears in both the build process (SLS) and post-processing contexts;
    the distinction matters.
  ideal_retrieved_chunks: []
