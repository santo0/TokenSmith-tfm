- id: pl_am_003
  mode: polysemy
  question: What does 'feedstock' mean in additive manufacturing?
  expected_answer: In AM, feedstock refers to the raw material input to the 3D printing
    process. Feedstock can take different physical forms depending on the process
    — powder (metal, ceramic, or polymer) for powder bed fusion, binder jetting, and
    blown-powder DED; wire (metal welding wire) for wire-fed DED processes; filament
    (polymer or metal-bound polymer) for material extrusion; liquid resin for vat
    photopolymerization; and sheets for sheet lamination. Feedstock qualification
    involves verifying chemistry, particle size distribution (for powders), gauge
    (for wire/sheet), and certifications before use in a qualified process.
