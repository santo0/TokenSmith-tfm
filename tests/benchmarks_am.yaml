- id: pl_am_005
  mode: polysemy
  question: What does 'resolution' mean when referring to AM parts or files?
  expected_answer: In AM, resolution has two related but distinct meanings. File resolution
    refers to the fineness of the STL triangulation—more triangles yield a better
    approximation of curved surfaces but increase file size. Print resolution refers
    to the smallest feature or finest detail the AM machine can physically produce,
    determined by the energy source spot size (e.g., laser beam diameter in PBF),
    layer thickness, and material behavior. Low file resolution can introduce faceting
    artifacts even if the machine has high print resolution; conversely, high file
