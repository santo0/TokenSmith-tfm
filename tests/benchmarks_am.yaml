- id: vat_photopolymerization
  question: Describe how vat photopolymerization works and what materials it uses.
  expected_answer: Vat photopolymerization selectively cures liquid photopolymer held
    in a vat using light-activated polymerization. The layer is created where focused
    energy (a laser or focused light source) intersects the material in a stepwise
    fashion, solidifying a cross-section of the liquid resin. Materials are primarily
    polymers and composites, as well as metals suspended in photo-curable polymers.
    Common implementations include stereolithography (SLA) and digital light processing
    (DLP), differing mainly in whether the curing source is a point laser or a projected
    image.
  keywords:
  - vat photopolymerization
  - photopolymer
  - stereolithography
  - SLA
  - curing
