- id: am_design_workflow
  question: What are the eight steps of the AM design workflow?
  expected_answer: The eight steps of the AM Design Workflow are (1) 3D Model Design—
    creating a solid model that meets requirements; (2) Define Build Plan—sliced model,
    build orientation, support structures, and toolpath; (3) Prepare Material—chemistry,
    particle size distribution, certifications, and mixing; (4) Prepare AM System—
    calibration and pre-use checks; (5) Execute Build—run the build while collecting
    process data; (6) Inspect—dimensional and metallurgical inspection; (7) Post-
    process—heat treatment, machining, and surface treatments; (8) Final Inspect—
    dimensional, surface, and non-destructive evaluation.
  keywords:
  - AM design workflow
  - build plan
  - post-process
  - inspect
  similarity_threshold: 0.78
  ideal_retrieved_chunks: []
  broad: false
  sections:
