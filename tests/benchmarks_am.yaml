  question: Why is the buy-to-fly ratio important for selecting AM over conventional
    manufacturing for titanium parts?
  expected_answer: The buy-to-fly ratio measures how much raw material must be purchased
    relative to the final part weight. Titanium alloys are expensive to buy and costly
    to machine, meaning a high buy-to-fly ratio in conventional subtractive manufacturing
    leads to large amounts of expensive swarf. AM adds material only where needed,
    dramatically lowering this ratio and reducing both material procurement cost and
    machining time. This economic justification connects the materials chapter (titanium's
    cost and machinability) with the business chapter's AM cost model, which includes
    feedstock and process costs as key inputs.
