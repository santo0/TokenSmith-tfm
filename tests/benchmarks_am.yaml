- id: ec_am_005
  mode: entity_confusability
  question: What distinguishes certification from qualification in additive manufacturing?
  expected_answer: Qualification in AM is the process of establishing that machines,
    facilities, personnel, feedstock, and processes reliably and repeatably produce
    parts meeting requirements; it is a prerequisite activity focused on the manufacturing
    system. Certification is the formal approval by a regulatory or standards authority
    (e.g., FAA, FDA) that a product, process, or system meets the required standards
    and is approved for a specific use. Qualification feeds evidence into a certification
    package, but certification also encompasses design approval, material data, and
    compliance with airworthiness or safety standards beyond the manufacturing process
    alone.
