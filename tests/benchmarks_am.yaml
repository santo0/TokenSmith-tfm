- id: tbga_maturity_model
  question: What is the TBGA AM Maturity Model and how does it work?
  expected_answer: The TBGA (The Barnes Global Advisors) AM Maturity Model is a framework
    for matching product requirements to the skills and knowledge needed for AM adoption.
    The Y-axis describes increasing product or design complexity and product requirements
    (Levels 0 through 4), while the X-axis represents the learning and capability
    needed to deploy, make, or manufacture parts to meet those requirements. Starting
    at Level 0 and progressing incrementally reduces the risk of failure, analogous
    to training before running a marathon. Jumping directly to Level 4 without building
    foundational skills introduces high risk.
  keywords:
