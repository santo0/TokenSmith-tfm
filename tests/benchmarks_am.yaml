  - Section 4.2 Design Optimization
- id: am_qualification_overview
  question: What does AM qualification involve?
  expected_answer: AM qualification ensures that machines, facilities, personnel,
    feedstock, and processes reliably produce parts meeting requirements. It includes
    facility qualification (environment, utilities, safety), machine qualification
    (verifying that the AM system performs within specifications), part qualification
    (demonstrating that a specific part geometry and material combination meets design
    requirements), process qualification/validation (confirming the process is stable
    and repeatable), personnel qualification (training and competency verification),
    and feedstock qualification (verifying material chemistry, particle size distribution,
    and other properties). Production acceptance testing, statistical process control,
    and lot acceptance testing are also part of sustaining qualification once production
    begins.
  keywords:
  - qualification
  - machine qualification
  - part qualification
  - feedstock qualification
  - personnel qualification
  similarity_threshold: 0.78
  ideal_retrieved_chunks: []
  broad: true
  sections:
