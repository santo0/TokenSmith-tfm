  sections:
  - Section 1.2 Additive Manufacturing Processes
- id: stl_file_format
  question: What is an STL file and what are its limitations?
  expected_answer: An STL (stereolithography / standard triangle language / standard
    tessellation language) file describes only the surface geometry of a 3D object
    using an unstructured triangulated surface with vertices in a Cartesian coordinate
    system. It contains no color, material, texture, or scale information. Its main
    limitations are that it stores little real information, making change tracking
    difficult, and coarse triangulation produces faceted surfaces. Alternative formats
    such as AMF and 3MF address these limitations by including metadata, color, texture,
    multiple materials, and lattice information.
  keywords:
  - STL file
  - stereolithography
  - triangulated surface
  - limitations
  similarity_threshold: 0.75
