- id: shared_nothing_architecture
  question: What is a shared-nothing architecture?
  expected_answer: A shared-nothing architecture is a distributed database design
    in which each processing node has its own private memory and local disk storage
    with no shared resources between nodes. Nodes communicate exclusively via a high-speed
    interconnect using message passing. This eliminates resource contention, enables
    linear scalability by adding independent nodes, and is the dominant model for
    parallel and distributed database systems.
