- id: ec_001
  mode: entity_confusability
  question: What's the difference between two-phase locking and strict two-phase locking?
  expected_answer: Two-phase locking (2PL) acquires all locks before releasing any
    but may release exclusive locks before the transaction commits, which can cause
    cascading rollbacks if that transaction later aborts. Strict 2PL holds all exclusive
    locks until the transaction commits or aborts, preventing dirty reads and cascading
    aborts entirely, making recovery straightforward.
  keywords:
