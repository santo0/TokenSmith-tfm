- id: pl_006
  mode: polysemy
  question: What does normal form mean in database design?
  expected_answer: A normal form is a standard that characterizes and eliminates redundancy
    and update anomalies in relational schemas. 1NF requires all attributes to be
    atomic; 2NF eliminates partial dependencies on the primary key; 3NF eliminates
    transitive dependencies on non-prime attributes; BCNF strengthens 3NF by requiring
    every determinant to be a superkey. Higher normal forms (4NF, 5NF) address multi-valued
    and join dependencies.
  keywords:
  - normal form
  - database design
  similarity_threshold: 0.62
  notes: Normal form (normalization), not statistical/geometric 'normal'.
  broad: true
