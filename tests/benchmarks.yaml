- id: physical_storage_media
  question: What are different physical storage media?
  expected_answer: Physical storage media include cache memory (fastest, most volatile),
    main/DRAM memory (fast but volatile), flash/SSD memory (non-volatile, fast reads),
    magnetic disks/HDDs (non-volatile, high capacity, slower mechanical access), optical
    disks (removable, sequential-friendly), and magnetic tape (cheapest, sequential-only,
    archival). They form a storage hierarchy from fastest and most expensive per byte
    at the top to slowest and cheapest at the bottom, and are classified as volatile
    (lose data on power loss) or non-volatile.
  keywords:
