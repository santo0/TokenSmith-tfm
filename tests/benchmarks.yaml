- id: cs_001
  mode: cross_section_evidence
  question: Why does a sort-merge join prefer sequential disk access over random access?
  expected_answer: Magnetic disks incur seek time and rotational latency on every
    random I/O, making random access orders of magnitude slower than sequential reads.
    Sort-merge join reads each input relation once in sorted order and merges them
    with a single sequential scan of both, so its I/O cost is proportional to the
    sizes of the two relations rather than the number of matching tuple pairs. This
    is why the query optimizer favors sort-merge join on large unsorted inputs when
    no useful index exists.
  keywords:
  - sort-merge join
  - sequential I/O
  - random access
  - disk
  similarity_threshold: 0.65
  notes: Disk access cost model lives in storage chapter; sort-merge join algorithm
    in query processing chapter — both are required to explain the preference.
