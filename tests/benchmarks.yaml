  mode: entity_confusability
  question: What distinguishes hash indexing from hash join?
  expected_answer: A hash index is a persistent data structure that uses a hash function
    to map key values to bucket addresses on disk, supporting O(1) average point lookups.
    A hash join is a query-execution algorithm that partitions both input relations
    by hashing the join attribute, then probes one partition against the other to
    find matching tuples; it is a transient, in-memory (or buffer-managed) operation,
    not a stored structure.
