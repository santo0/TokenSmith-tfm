- id: cs_003
  mode: cross_section_evidence
  question: How do write-ahead logging and checkpointing work together during recovery?
  expected_answer: Write-ahead logging (WAL) guarantees every update is recorded to
    stable storage before the modified page is written to disk. Checkpointing periodically
    flushes dirty pages and records a checkpoint in the log, bounding the recovery
    window. During recovery (as in ARIES), the system replays all log records from
    the last checkpoint forward to redo committed updates, then scans backward to
    undo any uncommitted transactions.
