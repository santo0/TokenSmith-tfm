- id: cs_001
  mode: cross_section_evidence
  question: How does strict two-phase locking prevent cascading rollbacks?
  expected_answer: Strict two-phase locking holds all exclusive locks until a transaction
    commits or aborts. Because no other transaction can read a data item whose exclusive
    lock has not been released, no transaction ever reads uncommitted (dirty) data.
    If a transaction aborts, no concurrent transaction has seen its changes, so there
    is nothing to cascade-abort.
  keywords:
  - strict two-phase locking
  - cascading rollback
  similarity_threshold: 0.62
  notes: Mechanism and consequence typically in different sections.
