- id: pl_005
  mode: polysemy
  question: Describe a view in SQL.
  expected_answer: A view in SQL is a named virtual relation defined by a stored query
    expression. It does not physically store data; querying the view re-executes the
    defining query at runtime. Views simplify complex queries, restrict visible data
    for security, and can be made updatable when defined on a single base table without
    aggregation or distinct. Materialized views do store results and must be refreshed
    when the base data changes.
  keywords:
  - view
