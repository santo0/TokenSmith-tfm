- id: cs_006
  mode: cross_section_evidence
  question: Why do isolation levels affect phantom reads?
  expected_answer: Phantom reads occur when a transaction re-executes a predicate-based
    query and finds new rows inserted by a committed concurrent transaction. Lower
    isolation levels (Read Committed, Repeatable Read) lock only existing rows, leaving
    the predicate range open to new insertions. Serializable isolation prevents phantoms
    by using predicate locks or next-key locks that block any insert satisfying the
    scanned predicate.
