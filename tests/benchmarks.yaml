- id: pl_003
  mode: polysemy
  question: How does a hash work for indexing?
  expected_answer: A hash index applies a hash function to a search-key value to compute
    a bucket address in a hash table stored on disk. To look up a key, the hash function
    is evaluated and the target bucket is scanned for matching records, giving O(1)
    average access time. Static hashing uses a fixed bucket count; extendible and
    linear hashing grow the table dynamically to handle overflow without degrading
    performance.
  keywords:
  - hash
  - indexing
  similarity_threshold: 0.62
  notes: Disambiguates hash indexing from hash join or cryptographic hashing.
