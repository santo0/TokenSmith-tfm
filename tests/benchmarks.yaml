- id: pl_001
  mode: polysemy
  question: What is a key in the context of relations and tuples?
  expected_answer: In the relational model, a key is a set of attributes that uniquely
    identifies each tuple in a relation. A superkey is any attribute set with this
    uniqueness property; a candidate key is a minimal superkey (no proper subset is
    also a superkey); and the primary key is the candidate key chosen by the designer
    as the principal identifier, whose attributes are prohibited from being null.
  keywords:
  - key
  - relations
  - tuples
  similarity_threshold: 0.62
  notes: Context entities disambiguate to relational key, not encryption/sort key.
  broad: false
