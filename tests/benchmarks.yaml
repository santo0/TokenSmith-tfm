  question: What isolation guarantees does SQL provide by default?
  expected_answer: Serializable. In the SQL standard, the default isolation level
    is Serializable, which guarantees that the outcome of concurrently executing transactions
    is equivalent to some serial (one-at-a-time) order of those transactions—thereby
    preventing dirty reads, nonrepeatable reads, and phantoms.
