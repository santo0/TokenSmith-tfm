- id: oltp_vs_analytics
  question: Contrast the goals of Online Transaction Processing and data analytics
  expected_answer: Online Transaction Processing (OLTP) supports a large number of
    concurrent users performing small, fast transactions that retrieve and update
    relatively small amounts of data with requirements for high throughput, low latency,
    and immediate consistency, typically using normalized schemas optimized for transactional
    integrity. Data analytics, in contrast, processes large volumes of historical
    data to draw conclusions and infer patterns for business intelligence and decision
    support, involving complex queries that scan and aggregate data across many records,
    often using denormalized schemas like star schemas in data warehouses optimized
    for read-heavy analytical workloads rather than transactional updates.
  keywords:
  - online transaction processing
  - data analytics
