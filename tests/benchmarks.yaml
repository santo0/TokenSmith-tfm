- id: buffer_pool_replacement
  question: How does the database buffer manager decide which page to evict?
  expected_answer: The buffer manager keeps a pool of frames in main memory. When
    all frames are occupied and a new page is needed, it must evict one. For general
    workloads, LRU (least-recently-used) eviction approximates optimal replacement
    by discarding the frame unused for the longest time. Database workloads often
    violate the locality assumptions of LRU — sequential scans access each page once
    and then never again — so many systems use MRU (most-recently-used) for scans
    or allow the query executor to hint that a page will not be reused (toss-immediate
    policy). Pages marked dirty must be written to disk before eviction; pinned pages
    cannot be evicted at all.
  keywords:
  - buffer manager
  - page eviction
  - LRU
  - replacement strategy
