- id: pl_004
  mode: polysemy
  question: What's a schedule when talking about transactions?
  expected_answer: A schedule in transaction management is an ordering that interleaves
    the read, write, commit, and abort operations of multiple concurrent transactions
    while preserving the internal order of each transaction's operations. A serial
    schedule runs transactions sequentially with no interleaving; a serializable schedule
    is any interleaved schedule whose effect on the database is equivalent to some
    serial schedule.
  keywords:
  - schedule
  - transactions
  similarity_threshold: 0.62
  notes: Transaction schedule, not OS scheduling.
