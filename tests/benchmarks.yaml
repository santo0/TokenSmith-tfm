- id: relational_algebra
  question: What are the fundamental operations of the relational algebra?
  expected_answer: Relational algebra defines six fundamental operations. Select (σ)
    filters tuples satisfying a predicate. Project (π) outputs a chosen subset of
    attributes, eliminating duplicate tuples. Rename (ρ) gives an expression or its
    attributes new names. Union (∪) returns all tuples appearing in either of two
    compatible relations. Set-difference (−) returns tuples in one relation but not
    the other. Cartesian product (×) pairs every tuple of one relation with every
    tuple of another. Derived operations such as natural join, intersection, and division
    are defined in terms of these six and appear in query shorthand.
  keywords:
