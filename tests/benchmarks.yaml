  expected_answer: A database schema is the overall logical design and structure of
    the database, analogous to variable declarations in a program, defining the relations,
    their attributes, data types, and constraints including primary keys and foreign
    keys. The schema remains relatively stable over time, while a database instance
    represents the actual collection of data stored at a particular moment, with values
