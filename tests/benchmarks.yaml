- id: primary_foreign_keys
  question: Explain primary keys and foreign keys
  expected_answer: A primary key is a set of one or more attributes that uniquely
    identifies each tuple in a relation, chosen from candidate keys which are minimal
    superkeys; primary key attributes are underlined in schema diagrams and cannot
    have null values. A foreign key is a set of attributes in one relation (the referencing
    relation) that references the primary key of another relation (the referenced
    relation), establishing a referential integrity constraint that requires values
    in the foreign key to match values in the referenced primary key, thereby linking
    related data across tables.
