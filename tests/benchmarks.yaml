- id: ec_004
  mode: entity_confusability
  question: How is 3NF different from BCNF?
  expected_answer: 'BCNF requires that for every non-trivial functional dependency
    X→Y, X is a superkey. 3NF is weaker: it additionally permits Y to be a prime attribute
    (part of some candidate key). Every BCNF relation is in 3NF but not vice versa.
    The practical trade-off is that 3NF always admits a lossless, dependency-preserving
    decomposition, whereas BCNF may require sacrificing dependency preservation.'
