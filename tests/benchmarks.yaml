- id: cs_002
  mode: cross_section_evidence
  question: Why does multiversion concurrency control avoid read locks?
  expected_answer: Multiversion concurrency control (MVCC) keeps multiple timestamped
    versions of each data item. A reading transaction accesses the most recent version
    committed before its start timestamp without blocking writers, because it reads
    from a snapshot that writers cannot modify. Since reads and writes target different
    versions, they never conflict, so read locks are unnecessary and read throughput
    is greatly improved.
  keywords:
  - multiversion concurrency control
  - read lock
