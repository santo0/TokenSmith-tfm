- id: hdd_vs_ssd
  question: What are the main differences between HDD and SSD storage devices?
  expected_answer: HDDs use rotating magnetic platters with mechanical read/write
    heads, incurring seek time and rotational latency that slow random access; SSDs
    use NAND flash memory with no moving parts, offering faster random access, lower
    latency, and better shock resistance. SSDs are historically more expensive per
    gigabyte but that gap has narrowed; flash cells also have a limited number of
    write cycles before wearing out, whereas HDD capacity per dollar remains higher
    for bulk storage.
  keywords:
