- id: er_to_relational
  question: How do you convert an E-R diagram into a relational schema?
  expected_answer: Each strong entity set becomes a relation whose attributes match
    the entity set's attributes, with the same primary key. Each weak entity set becomes
    a relation that includes the primary key of its identifying entity set as a foreign
    key; the two together form the weak entity's primary key. A many-to-many relationship
    set maps to its own relation containing the primary keys of both participating
    entity sets (as foreign keys) plus any descriptive attributes of the relationship.
    Many-to-one and one-to-one relationship sets can be merged into one of the participating
    entity relations by adding the other's primary key as a foreign key, avoiding
    an extra relation and join.
  keywords:
  - E-R diagram
