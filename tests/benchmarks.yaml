- id: sql_dml
  question: How do INSERT, DELETE, and UPDATE work in SQL?
  expected_answer: INSERT adds tuples to a relation either from an explicit values
    list or from the result of a subquery; it does not drop the relation's schema.
    DELETE removes tuples matching a where-clause predicate; omitting the predicate
    deletes all tuples but leaves the empty relation in place. UPDATE modifies attribute
    values of existing tuples and can use a case expression to apply different values
    to different rows in a single pass. All three statements can trigger referential-integrity
    actions — cascade, set null, or set default — on relations that reference the
    modified relation via foreign keys.
  keywords:
  - INSERT
