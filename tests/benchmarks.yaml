- id: multi_hop_001
  mode: multi_hop
  question: Why does a B+ tree's high fan-out reduce the number of latch acquisitions
    needed during concurrent index traversal?
  expected_answer: A B+ tree node is sized to fill a disk page, giving fan-out of
    several hundred keys per internal node. Even for millions of entries the tree
    stays 3-4 levels tall. The crabbing (latch-coupling) protocol acquires a latch
    on each node visited top-down and releases the parent once the child is latched
    and deemed safe (no imminent split or merge). Because the tree is shallow, a single
    traversal acquires and releases only 3-4 latches regardless of database size.
    High fan-out therefore directly bounds latch overhead per operation and reduces
    contention at the root.
  keywords:
  - B+ tree
  - fan-out
  - latch crabbing
  - concurrent index traversal
  similarity_threshold: 0.6
  notes: Requires connecting B+ tree structure (indexing chapter) with latch-crabbing
    concurrency protocol (concurrency control chapter) — neither chunk alone answers
    the question.
