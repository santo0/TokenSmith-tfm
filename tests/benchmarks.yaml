- id: acid_properties
  question: What are the ACID properties of transactions?
  expected_answer: Atomicity ensures a transaction's actions are all-or-nothing, enforced
    by abort/rollback and recovery that can undo partial effects; consistency requires
    each transaction to preserve database integrity when run alone and relies on the
    scheduler to admit serializable, recoverable, and preferably cascadeless schedules;
    isolation makes concurrent executions equivalent to some serial order, commonly
    achieved with two-phase locking variants that prevent reads of uncommitted data;
    durability guarantees committed effects persist across crashes via logging to
    stable storage and redo on restart;
  keywords:
  - ACID property
