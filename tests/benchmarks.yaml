- id: pl_002
  mode: polysemy
  question: Explain a lock in a transaction context.
  expected_answer: In transaction management, a lock is a concurrency-control mechanism
    that regulates access to a shared data item. A shared (read) lock allows multiple
    transactions to read the item simultaneously; an exclusive (write) lock permits
    only one transaction to modify it and blocks all other accesses. Lock protocols
    such as two-phase locking specify when locks must be acquired and released to
    ensure conflict-serializable schedules.
  keywords:
  - lock
  - transaction
  similarity_threshold: 0.62
  notes: Transaction context disambiguates from OS/file locking.
