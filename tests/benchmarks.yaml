- id: ec_002
  mode: entity_confusability
  question: When should I use a B+ tree instead of a B-tree?
  expected_answer: B+ trees store all data records only in leaf nodes, which are linked
    in a sorted chain enabling efficient range scans via sequential traversal. Internal
    nodes contain only routing keys. B-trees store data in both internal and leaf
    nodes, giving faster single-key lookups in some cases but making range queries
    expensive. For disk-based database indexes where range scans are common, B+ trees
    are preferred.
