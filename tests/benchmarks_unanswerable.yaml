    database manuals as of 2018, including MySQL 8.0 and Oracle 12c, but contains
    no information on PostgreSQL releases or SQL extensions introduced after the book's
    publication.
  keywords:
  - PostgreSQL
  - SQL syntax
  - version 17
  - version 18
  - database release
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires information on software releases (PostgreSQL 17/18)
    that post-date the textbook's 2018 reference frame.

- id: udsc_nosql_market_share_2025
