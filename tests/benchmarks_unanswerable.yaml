benchmarks:
- id: udsc_ssd_price_2026
  question: What is the current market price of a 20-terabyte Solid State Drive (SSD)
    in 2026?
  expected_answer: The textbook cannot answer this question. It provides storage cost
    estimates only as of 2018, noting that a 1-terabyte SSD cost approximately $250
    at that time, but contains no pricing data for later years or for the 20-terabyte
    capacity tier.
  keywords:
  - SSD
  - solid state drive
  - market price
  - 2026
  - storage cost
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Requires post-publication hardware pricing data (2026) beyond
    the textbook's 2018 cost estimates.

- id: udsc_mobile_app_kotlin_swift
  question: How do you write a complete mobile application in Kotlin or Swift to interface
    with a database?
  expected_answer: The textbook cannot answer this question. It acknowledges the importance
    of mobile application interfaces and mentions development frameworks in passing,
    but explicitly states that mobile application development is outside the book's
    scope.
  keywords:
  - mobile application
  - Kotlin
  - Swift
  - mobile development
  - database interface
  similarity_threshold: 0.3
  ideal_retrieved_chunks: []
  answerable: false
  reason_unanswerable: Mobile application development is explicitly excluded from
    the textbook's stated scope.

